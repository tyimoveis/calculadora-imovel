<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Imóveis - Gleba Palhano</title>
  <style>
    :root {
      --primaria: #1f6feb;
      --secundaria: #e9f1ff;
      --fundo: #f0f4f8;
      --texto: #2c3e50;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--fundo);
      color: var(--texto);
    }

    form {
      background: white;
      padding: 30px;
      border-radius: 16px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      color: var(--primaria);
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
    }

    input, select, textarea {
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background-color: #fff;
      transition: border 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primaria);
      outline: none;
    }

    button {
      background-color: var(--primaria);
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #155cc4;
    }

    #resultado {
      margin-top: 20px;
      font-size: 1.3em;
      font-weight: bold;
      color: #28a745;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      form {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <form id="formulario">
    <h2>Avaliação de Imóvel - Gleba Palhano</h2>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone" required>

    <label for="tipo">Tipo do imóvel</label>
    <select id="tipo" name="tipo" required>
      <option value="">Selecione</option>
      <option value="compacto">Compacto (até 2 quartos)</option>
      <option value="medio">Médio (3 quartos)</option>
      <option value="alto">Alto padrão (3 suítes ou mais)</option>
    </select>

    <label for="quartos">Número de quartos</label>
    <select id="quartos" name="quartos" required>
      <option value="">Selecione</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4+</option>
    </select>

    <label for="suites">Número de suítes</label>
    <select id="suites" name="suites" required>
      <option value="">Selecione</option>
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3+</option>
    </select>

    <label for="metragem">Metragem (m²)</label>
    <input type="number" id="metragem" name="metragem" required>

    <label for="andar">Andar</label>
    <select id="andar" name="andar" required>
      <option value="">Selecione</option>
      <option value="baixo">Baixo</option>
      <option value="medio">Médio</option>
      <option value="alto">Alto</option>
    </select>

    <label for="garagem">Vagas de garagem</label>
    <select id="garagem" name="garagem" required>
      <option value="">Selecione</option>
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3+</option>
    </select>

    <label for="lazer">Lazer completo?</label>
    <select id="lazer" name="lazer" required>
      <option value="">Selecione</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <label for="vista">Vista para o Lago Igapó?</label>
    <select id="vista" name="vista" required>
      <option value="">Selecione</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <label for="mobilia">Imóvel mobiliado?</label>
    <select id="mobilia" name="mobilia" required>
      <option value="">Selecione</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <label for="ano">Ano de construção</label>
    <input type="number" id="ano" name="ano" required>

    <label for="obs">Observações</label>
    <textarea id="obs" name="obs" rows="4" required></textarea>

    <button type="button" onclick="calcularValor()">Calcular Valor Estimado</button>

    <div id="resultado"></div>
  </form>

  <script>
    function calcularValor() {
      const tipo = document.getElementById("tipo").value;
      const metragem = parseFloat(document.getElementById("metragem").value);
      let valorM2 = 6000;

      if (tipo === "compacto") valorM2 = 7000;
      else if (tipo === "medio") valorM2 = 8000;
      else if (tipo === "alto") valorM2 = 10000;

      let valorBase = metragem * valorM2;

      const suites = parseInt(document.getElementById("suites").value);
      const andar = document.getElementById("andar").value;
      const lazer = document.getElementById("lazer").value;
      const vista = document.getElementById("vista").value;
      const mobilia = document.getElementById("mobilia").value;

      if (suites > 1) valorBase *= 1.05;
      if (andar === "alto") valorBase *= 1.05;
      if (lazer === "sim") valorBase *= 1.05;
      if (vista === "sim") valorBase *= 1.1;
      if (mobilia === "sim") valorBase *= 1.05;

      const valorFinal = Math.round(valorBase);

      document.getElementById("resultado").innerText = `Valor estimado: R$ ${valorFinal.toLocaleString('pt-BR')}`;
    }
  </script>

</body>
</html>
